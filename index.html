<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="A living pixel-material simulation of the violet ocean world Mare Infinitus.">

  <body>
    <main class="mare-shell mode-b">
      <canvas class="mare-canvas" aria-label="A living pixel simulation of the ocean moon Mare Infinitus"></canvas>
      <header class="lab-header ui-chrome">
        <p>MARE INFINITUS</p>
        <span>material study / live</span>

      <section class="style-switcher ui-chrome" aria-label="Visual style">
        <p>VISUAL DENSITY</p>
        <div>
          <button data-mode="A"><span>A</span>Austere</button>
          <button data-mode="B" class="active"><span>B</span>Balanced</button>
          <button data-mode="C"><span>C</span>Luminous</button>
        </div>
        <small>A/B/C style · F fullscreen · H interface</small>
      </section>
    </main>
    <script src="app.js"></script>
