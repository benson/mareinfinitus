name: Build screensavers

on:
  workflow_dispatch:
  push:
    tags:
      - "screensaver-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:web
      - run: npm test
      - name: Build Windows screensaver
        shell: pwsh
        run: ./screensaver/windows/build.ps1 -Architecture x64 -Clean
      - uses: actions/upload-artifact@v7
        with:
          name: mare-infinitus-windows
          path: screensaver/windows/release/MareInfinitus-Screensaver-Windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:web
      - run: npm test
      - name: Build universal macOS screensaver
        run: SCENE=time-tombs bash screensaver/macos/build.sh
      - name: Package ad-hoc signed test build
        run: |
          mkdir -p screensaver/macos/release
          ditto -c -k --sequesterRsrc --keepParent \
            "screensaver/macos/build/Mare Infinitus.saver" \
            "screensaver/macos/release/MareInfinitus-Screensaver-macOS-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mare-infinitus-macos
          path: screensaver/macos/release/MareInfinitus-Screensaver-macOS-universal.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/screensaver-v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.zip
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --prerelease
          --title "Mare Infinitus screensaver ${GITHUB_REF_NAME}"
